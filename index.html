<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SimWolf</title>
  <link rel="icon" type="image/png" href="./images/wolf-icon.png" sizes="32x32">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="app">
    <div id="sidebar">
      <button id="arrow-mode-toggle">
        <svg id="arrow-keys-placeholder" width="26" height="26" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="1">
          <!-- Up arrow -->
          <path d="M12 2 L9 6 H11 V10 H13 V6 H15 Z" />
          <!-- Down arrow -->
          <path d="M12 22 L9 18 H11 V14 H13 V18 H15 Z" />
          <!-- Left arrow -->
          <path d="M2 12 L6 9 V11 H10 V13 H6 V15 Z" />
          <!-- Right arrow -->
          <path d="M22 12 L18 9 V11 H14 V13 H18 V15 Z" />
        </svg>
        <svg id="arrow-mode-icon" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <!-- set by animat.showArrowMode -->
        </svg>
      </button>

      <div class="zoom-buttons">
        <button id="zoom-in" aria-label="Zoom In">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="9"/>
            <line x1="12" y1="8" x2="12" y2="16"/>
            <line x1="8" y1="12" x2="16" y2="12"/>
          </svg>
        </button>

        <button id="zoom-out" aria-label="Zoom Out">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="9"/>
            <line x1="8" y1="12" x2="16" y2="12"/>
          </svg>
        </button>

      </div>

      <div id="exertion-meters">
        <div class="exertion-meter"><div id="wind-meter-fill" class="exertion-meter-fill"></div></div>
        <div class="exertion-meter"><div id="stamina-meter-fill" class="exertion-meter-fill"></div></div>
        <div class="food-meter">
          <div class="exertion-meter"><div id="food-meter-fill" class="exertion-meter-fill"></div></div>
          <div class="exertion-meter"><div id="gut-meter-fill" class="exertion-meter-fill"></div></div>
        </div>
      </div>

      <!-- The critter the camera follows, if not the player's wolf: its meters, under an eye -->
      <div id="inspect-panel" hidden>
        <svg id="inspect-icon" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M2 12 C5 6.5 8.5 4.5 12 4.5 C15.5 4.5 19 6.5 22 12 C19 17.5 15.5 19.5 12 19.5 C8.5 19.5 5 17.5 2 12 Z" />
          <circle cx="12" cy="12" r="3.5" />
          <circle cx="12" cy="12" r="1.2" fill="currentColor" />
        </svg>
        <div class="exertion-meter"><div id="inspect-wind-fill" class="exertion-meter-fill"></div></div>
        <div class="exertion-meter"><div id="inspect-stamina-fill" class="exertion-meter-fill"></div></div>
        <div class="food-meter">
          <div class="exertion-meter"><div id="inspect-food-fill" class="exertion-meter-fill"></div></div>
          <div class="exertion-meter"><div id="inspect-gut-fill" class="exertion-meter-fill"></div></div>
        </div>
      </div>

      <div id="cursor-coords">
        x: –, y: –
      </div>
    </div>
    <div id="field-wrapper">
      <!-- The world: drawn by animat.js -->
      <canvas id="field-canvas"></canvas>
      <!-- Movement pad: rings for gallop, trot, walk and stop. controls.js reads their
           radii from here. -->
      <div id="move-pad" aria-label="Movement pad">
        <svg viewBox="-100 -100 200 200" xmlns="http://www.w3.org/2000/svg">
          <circle class="ring" data-pose="gallop" r="100" />
          <circle class="ring" data-pose="trot" r="72" />
          <circle class="ring" data-pose="walk" r="44" />
          <circle class="ring deadzone" data-pose="idle" r="15" />
          <circle id="move-pad-knob" r="10" cx="0" cy="0" />
        </svg>
      </div>
    </div>
  </div>

  <!-- Five parts, each one global object, connected here and nowhere else:
         sim       the world and its rules (sim.js)
         senses    what each critter perceives (senses.js)
         mind      what each critter decides, as intents for sim (mind.js)
         animat    draws the world (animat.js)
         controls  the player's input, as intents for sim and changes to animat, handing
                   the wolf to mind on request (controls.js)
       To run without drawing (in a browser console or Node), load the first three and run:
         sim.init(); senses.attach(sim); mind.attach(sim, senses); sim.start({ consoleOnly: true }); -->
  <script src="sim.js"></script>
  <script src="senses.js"></script>
  <script src="mind.js"></script>
  <script src="animat.js"></script>
  <script src="controls.js"></script>
  <script>
    window.addEventListener("load", () => {
      sim.init();
      senses.attach(sim);
      mind.attach(sim, senses);
      animat.attach(sim);
      controls.attach(sim, animat, mind);
      sim.start();
    });
  </script>
</body>
</html>
