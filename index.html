<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SimWolf</title>
  <link rel="icon" type="image/png" href="./images/wolf-icon.png" sizes="32x32">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { height: 100%; overflow: hidden; background-color: #222; }
    #app { display: flex; height: 100%; }
    #sidebar {
      width: 150px;
      background: #333;
      color: white;
      display: flex;
      flex-direction: column;
      padding: 15px;
      gap: 10px;
      border-right: 2px solid #444;
    }
    #sidebar button {
      padding: 10px;
      background-color: #555;
      color: white;
      border: 1px solid #666;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      transition: background-color 0.3s;
    }
    #sidebar button:hover:not(:disabled) { background-color: #777; }
    #sidebar button:disabled {
      background-color: #444;
      color: #777;
      cursor: default;
    }
    .zoom-buttons {
      display: flex;
      gap: 5px;
      width: 100%;
    }
    .zoom-buttons button {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }
    /* Exertion meters for the player's wolf: the wind bar (burst reserve, limits
       galloping) sits directly on top of the stamina bar (endurance reserve, limits
       trotting). Full bar = full reserve. No labels: no words or numbers in gameplay UI. */
    .exertion-meter {
      height: 6px;
      width: 100%;
      background-color: darkslategrey;
    }
    .exertion-meter-fill {
      height: 100%;
      width: 100%;
    }
    #wind-meter-fill { background-color: #7fe6ff; }
    #stamina-meter-fill { background-color: yellow; }
    #field-wrapper {
      flex: 1;
      position: relative;
      overflow: hidden;
      background-color: #9dd4f3;
    }
    #field {
      position: absolute;
      top: 0;
      left: 0;
      width: 3000px;
      height: 3000px;
      will-change: transform;
      transform: translate(0px, 0px) scale(1);
      transform-origin: 50% 50%;
      image-rendering: pixelated;
    }
    .tile {
      position: absolute;
      width: 32px;
      height: 32px;
      background-image: url('./images/tiles.png');
      background-repeat: no-repeat;
      background-size: auto;
      image-rendering: pixelated;
    }
    /* Critter sprites: every critter element has .critter plus ONE sprite-sheet class.
       Each sheet class sets that sheet's image and frame size. A pose's `sheet` in
       frameDataBySpeciesAndPose (main.js) names its class; frameW/frameH there must
       match the width/height here. */
    .critter {
      position: absolute;
      background-repeat: no-repeat;
      image-rendering: pixelated;
    }
    .wolf {
      width: 64px;
      height: 64px;
      background-image: url('./images/wolf-run-stand.png');
    }
    .wolf-swim {
      width: 64px;
      height: 64px;
      background-image: url('./images/wolf-swim.png');
    }
    .deer {
      width: 32px;
      height: 41px;
      background-image: url('./images/stag-walk-idle-run.png');
    }
    .deer-swim {
      width: 40px;
      height: 48px;
      background-image: url('./images/stag-swim.png');
    }
    #dbel-pc-wolf {
      position: absolute;
      width: 32px;
      height: 16px;
      background-image: url('./images/debug-tile.png');
      background-repeat: no-repeat;
      image-rendering: pixelated;
    }
    .layer {
      position: absolute;
      top: 0;
      left: 0;
    }
    /* Tiles and critter sprites share ONE stacking order so land tiles can be drawn over
       swimmers in front of them: these two layers must NOT set a z-index of their own
       (see "DRAWING ORDER" in animat.js). The debug layer stays above everything. */
    #tile-layer { z-index: auto; }
    #sprite-layer { z-index: auto; }
    #debug-layer { z-index: 1000000; }
    /* On-screen movement pad: lives in #field-wrapper (NOT #field) so it never scrolls or zooms. */
    #move-pad {
      position: absolute;
      right: 24px;
      bottom: 24px;
      width: 160px;
      height: 160px;
      z-index: 10;
      touch-action: none;
      user-select: none;
    }
    #move-pad svg { display: block; width: 100%; height: 100%; overflow: visible; }
    #move-pad .ring {
      fill: rgba(20, 30, 40, 0.18);
      stroke: rgba(255, 255, 255, 0.55);
      stroke-width: 1.5;
      transition: fill 0.12s;
    }
    #move-pad .ring.active { fill: rgba(255, 255, 160, 0.30); }
    #move-pad .ring.deadzone { fill: rgba(20, 30, 40, 0.30); }
    #move-pad .ring.deadzone.active { fill: rgba(255, 255, 255, 0.35); }
    #move-pad-knob {
      fill: rgba(255, 255, 255, 0.85);
      stroke: rgba(0, 0, 0, 0.4);
      stroke-width: 1;
      pointer-events: none;
      visibility: hidden;
    }
    #move-pad-knob.visible { visibility: visible; }
    .tile.dirt      { background-position: -288px    0px; }
    .tile.grass     { background-position: -64px   -64px; }
    .tile.bush      { background-position: -96px   -96px; }
    .tile.tallgrass { background-position: -160px  -96px; }
    .tile.flower    { background-position: -256px  -96px; }
    .tile.rock      { background-position: -288px -128px; }
    .tile.stone     { background-position: -192px -160px; }
    .tile.water     { background-position: -192px -288px; }
    .tile.ice       { background-position:   0px  -320px; }
  </style>
</head>
<body>
  <div id="app">
    <div id="sidebar">
      <button id="arrow-mode-toggle">
        <svg id="arrow-keys-placeholder" width="26" height="26" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="1">
          <!-- Up arrow -->
          <path d="M12 2 L9 6 H11 V10 H13 V6 H15 Z" />
          <!-- Down arrow -->
          <path d="M12 22 L9 18 H11 V14 H13 V18 H15 Z" />
          <!-- Left arrow -->
          <path d="M2 12 L6 9 V11 H10 V13 H6 V15 Z" />
          <!-- Right arrow -->
          <path d="M22 12 L18 9 V11 H14 V13 H18 V15 Z" />
        </svg>
        <svg id="arrow-mode-icon" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <!-- SVG set by script on page load -->
        </svg>
      </button>

      <div class="zoom-buttons">
        <button id="zoom-in" aria-label="Zoom In">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="9"/>
            <line x1="12" y1="8" x2="12" y2="16"/>
            <line x1="8" y1="12" x2="16" y2="12"/>
          </svg>
        </button>

        <button id="zoom-out" aria-label="Zoom Out">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="9"/>
            <line x1="8" y1="12" x2="16" y2="12"/>
          </svg>
        </button>

      </div>

      <div id="exertion-meters">
        <div class="exertion-meter"><div id="wind-meter-fill" class="exertion-meter-fill"></div></div>
        <div class="exertion-meter"><div id="stamina-meter-fill" class="exertion-meter-fill"></div></div>
      </div>

      <div id="cursor-coords" style="margin-top: auto; font-size: 12px; color: #aaa;">
        x: –, y: –
      </div>
    </div>
    <div id="field-wrapper">
      <div id="field">
        <div id="tile-layer" class="layer"></div>
        <div id="sprite-layer" class="layer"></div>
        <div id="debug-layer" class="layer">
          <div id="dbel-pc-wolf"></div>
        </div>
      </div>
      <!-- Movement pad. Rings (outer to inner): gallop, trot, walk, deadzone (stop).
           Radii are in a 100-unit viewBox and are read by main.js, so the drawing is the
           single source of truth for the ring sizes. -->
      <div id="move-pad" aria-label="Movement pad">
        <svg viewBox="-100 -100 200 200" xmlns="http://www.w3.org/2000/svg">
          <circle class="ring" data-pose="gallop" r="100" />
          <circle class="ring" data-pose="trot" r="72" />
          <circle class="ring" data-pose="walk" r="44" />
          <circle class="ring deadzone" data-pose="idle" r="15" />
          <circle id="move-pad-knob" r="10" cx="0" cy="0" />
        </svg>
      </div>
    </div>
  </div>

  <script src="main.js"></script>
  <script src="animat.js"></script>
</body>
</html>
