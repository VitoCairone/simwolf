
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Grass Ecology Simulation</title>
<style>
body { font-family: sans-serif; }
canvas { border:1px solid black; image-rendering: pixelated; }
</style>
</head>
<body>
<h3>Grass Ecology Simulation (1000x1000 world)</h3>
<p>7 perennial species (greens) and 3 annual species (tans). Viewport: 250x250.</p>
<canvas id="c" width="500" height="500"></canvas>
<script>
const W=1000,H=1000;
const VIEW=250;
const SCALE=2;

const PERENNIALS=[
 "#0b6623","#1f7a1f","#2e8b57","#3cb371",
 "#228b22","#6b8e23","#556b2f"
];
const ANNUALS=[
 "#727280","#d2b48c","#ffffff"
];

const EMPTY=-1;

const occ = new Int16Array(W*H).fill(EMPTY);
const seed = new Uint16Array(W*H); // annual seed bank
const disturbed = new Uint8Array(W*H);
const priorOcc = new Int16Array(W*H).fill(EMPTY);

function idx(x,y){ return y*W+x; }

function randInt(n){ return Math.floor(Math.random()*n); }

function seedInitial(){
    for(let i=0;i<50000;i++){
        const j = randInt(W)+randInt(H)*W
        occ[j]=randInt(7);
        priorOcc[j] = occ[j];
    }
    for(let i=0;i<20000;i++){
        const j=randInt(W)+randInt(H)*W;
        const val = 7+randInt(3);
        occ[j]= val;
        priorOcc[j] = val;
        seed[j]=50;
    }
}
seedInitial();

function neighbors(x,y){
    const out=[];
    for(let dy=-1;dy<=1;dy++){
        for(let dx=-1;dx<=1;dx++){
            if(!dx && !dy) continue;
            const nx=x+dx, ny=y+dy;
            if(nx>=0&&ny>=0&&nx<W&&ny<H) out.push(idx(nx,ny));
        }
    }
    return out;
}

function germinate(x, y, j) {
    let pScore=0, aScore=seed[j]*(disturbed[j]?4:1);

    // neighboring perennial mats
    for(const ni of neighbors(x,y)){
        const no=occ[ni];
        if(no>=0 && no<7) pScore+=5;
        if(no>=7) aScore+=1;
    }

    // long-distance annual dispersal
    if(Math.random()<0.002) aScore+=20;

    if(aScore>pScore && aScore>0){
        const val = 7+randInt(3);
        occ[j] = val;
        priorOcc[j] = val;
        if(seed[j]<500) seed[j]+=5;
    } else if(pScore>0){
        const val = randInt(7);
        occ[j] = val;
        priorOcc[j] = val;
    }
}

function step(){
    // disturbance pass (~0.03% of tiles)
    for(let k=0;k<300;k++){
        const j=randInt(W*H);
        occ[j]=EMPTY;
        disturbed[j]=10;
    }

    // ecological updates on random samples for speed
    for(let n=0;n<100000;n++){
        const x=randInt(W), y=randInt(H);
        const j=idx(x,y);

        if(disturbed[j]>0) disturbed[j]--;

        const o=occ[j];

        if(o===EMPTY){
            germinate(x, y, j);
        } else if(o<7){
            // perennial maintenance/spread
            if(Math.random()<0.0002){
                occ[j]=EMPTY; // occasional mortality
            }
        } else {
            // annual lifecycle
            seed[j]=Math.min(seed[j]+3,1000);

            // annuals die each "season"
            if(Math.random()<0.01){
                occ[j]=EMPTY;
            }
        }
    }
}

const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");
let camX=0, camY=0;

window.addEventListener("keydown",e=>{
    if(e.key==="ArrowRight") camX=Math.min(W-VIEW,camX+10);
    if(e.key==="ArrowLeft") camX=Math.max(0,camX-10);
    if(e.key==="ArrowDown") camY=Math.min(H-VIEW,camY+10);
    if(e.key==="ArrowUp") camY=Math.max(0,camY-10);
});

function render(){
    const img=ctx.createImageData(VIEW,VIEW);
    const d=img.data;
    let p=0;
    for(let y=0;y<VIEW;y++){
        for(let x=0;x<VIEW;x++){
            const j = idx(x+camX,y+camY);
            let o = occ[j];
            if (o === EMPTY) o = priorOcc[j];
            let hex="#654321"; // bare soil
            if(o>=0 && o<7) hex=PERENNIALS[o];
            else if(o>=7) hex=ANNUALS[o-7];

            const r=parseInt(hex.slice(1,3),16);
            const g=parseInt(hex.slice(3,5),16);
            const b=parseInt(hex.slice(5,7),16);

            d[p++]=r;
            d[p++]=g;
            d[p++]=b;
            d[p++]=255;
        }
    }

    const off=document.createElement("canvas");
    off.width=VIEW; off.height=VIEW;
    off.getContext("2d").putImageData(img,0,0);

    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(off,0,0,canvas.width,canvas.height);
}

function loop(){
    for(let i=0;i<5;i++) step();
    render();
    requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
